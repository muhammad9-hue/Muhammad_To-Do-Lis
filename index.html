<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Daftar Tugas</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Tulis tugas atau catatan..." autocomplete="off">
      <button id="addBtn">Tambah</button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMsg" class="empty">Belum ada tugas. Tambahkan tugas pertamamu.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
